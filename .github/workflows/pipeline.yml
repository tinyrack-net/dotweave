name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled merge-queue check reads as a failure and ejects the pull
  # request from the queue, so those runs always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' &&
    !startsWith(github.ref, 'refs/tags/v') &&
    github.event_name != 'merge_group' }}

jobs:
  # The repository has two independent halves -- the Dart CLI at the root and
  # the Node homepage under `homepage/` -- and a diff confined to one of them
  # does not need the other half's jobs. This job decides which halves a pull
  # request touches, and holds the one copy of every matrix the pipeline fans
  # out over.
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      dart: ${{ steps.scope.outputs.dart }}
      homepage: ${{ steps.scope.outputs.homepage }}
      test_matrix: ${{ steps.scope.outputs.test_matrix }}
      autocomplete_matrix: ${{ steps.scope.outputs.autocomplete_matrix }}
      package_matrix: ${{ steps.scope.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Anything that is not a pull request keeps the full scope, so it
          # never has to be decided from a diff. `tool/ci_scope.dart` runs
          # directly rather than through `dart run` because nothing is
          # resolved yet; it imports only the SDK for that reason.
          scope=full
          if [ -n "${PR_NUMBER}" ]; then
            if files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate --jq '.[].filename')"; then
              scope="$(printf '%s\n' "$files" | dart tool/ci_scope.dart)"
            else
              echo "::warning::Could not read the PR file list; using full scope"
            fi
          fi

          dart_jobs=true
          homepage_jobs=true
          case "$scope" in
            docs-only) dart_jobs=false; homepage_jobs=false ;;
            dart-only) homepage_jobs=false ;;
            homepage-only) dart_jobs=false ;;
          esac

          # Every host runs on every event. macOS and Windows are not
          # duplicates of the Linux run here -- this tool's subject is
          # filesystem semantics, so they exercise different code -- and the
          # runners are free for a public repository. `host` and `cross` stay
          # separate in ci-matrices.json so that narrowing a pull request to
          # the host entry stays a change to this one line.
          matrix_scope='.host, .cross'
          matrices=.github/ci-matrices.json
          {
            echo "scope=$scope"
            echo "dart=$dart_jobs"
            echo "homepage=$homepage_jobs"
            for name in test autocomplete package; do
              echo "${name}_matrix=$(jq -c "[.${name} | $matrix_scope] | add" \
                "$matrices")"
            done
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.homepage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm run format:check
        working-directory: homepage
      # A workflow change resolves to the full scope, so this always runs when
      # there is something for it to check.
      - name: Validate the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  dart-analyze:
    name: Dart Analyze
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - name: Validate Dart static checks
        run: dart run tool/validate.dart dart-static

  dart-test:
    name: Dart Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    strategy:
      # Linux is in this matrix, so a Windows failure must not cancel the leg
      # that reports the most about a change.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - name: Validate Dart tests
        run: dart run tool/validate.dart dart-tests

  homepage:
    name: Homepage
    needs: changes
    if: needs.changes.outputs.homepage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Validate homepage
        run: pnpm run validate
        working-directory: homepage
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: homepage
      - name: Audit homepage in Chromium
        run: pnpm run test:audit
        working-directory: homepage
      - name: Verify Cloudflare deployment bundle
        run: pnpm run deploy:dry-run
        working-directory: homepage

  autocomplete-shell-smoke:
    name: Autocomplete (${{ matrix.os }} / ${{ matrix.shell }})
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.autocomplete_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      # The OS label lives in ci-matrices.json, so these guards match a family
      # rather than pinning the same label a second time.
      - name: Install zsh (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.shell == 'zsh'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install fish (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.shell == 'fish'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Install fish (macOS)
        if: startsWith(matrix.os, 'macos') && matrix.shell == 'fish'
        shell: bash
        run: brew install fish
      - name: Install dependencies
        run: dart pub get
      - name: Build e2e binary
        run: dart tool/build_e2e.dart
      - name: Run autocomplete shell smoke tests
        env:
          DOTWEAVE_AUTOCOMPLETE_SHELL: ${{ matrix.shell }}
        run: dart test test/e2e/autocomplete_e2e_test.dart
          test/e2e/autocomplete_pty_e2e_test.dart

  build-and-package:
    name: Build & Package (${{ matrix.target }})
    needs:
      - changes
      - dart-analyze
      - dart-test
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.package_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - name: Install dependencies
        run: dart pub get

      - name: Compile executable
        run: dart compile exe bin/dotweave.dart -o ${{ matrix.asset }}

      - name: Sign binary (macOS)
        if: startsWith(matrix.target, 'macos') && (github.ref ==
          'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          dart run shipworld:shipworld package macos sign dotweave \
            --config shipworld.yaml \
            --input ${{ matrix.asset }} \
            ${{ !startsWith(github.ref, 'refs/tags/v') && '--skip-notarize' || '' }}

      - name: Smoke test binary
        run: dart run tool/smoke.dart --executable-path
          ${{ matrix.asset }}

      - name: Build MSIX package (Windows)
        if: matrix.msixarch && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: dart run shipworld:shipworld package windows msix
          dotweave --config shipworld.yaml --arch ${{ matrix.msixarch }}
          --input ${{ matrix.asset }}
          --output dist/pkg/dotweave-win-${{ matrix.msixarch }}.msix
          --package-root dist/msix/${{ matrix.msixarch }}

      - name: Smoke test MSIX alias (Windows x64)
        if: matrix.msixarch == 'x64' && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
        run: |
          $existing = Get-AppxPackage -Name "$env:MSIX_IDENTITY_NAME" -ErrorAction SilentlyContinue
          if ($existing) {
            Remove-AppxPackage -Package $existing.PackageFullName
          }
          Add-AppxPackage -Register (Resolve-Path "dist/msix/x64/AppxManifest.xml")
          try {
            dotweave.exe --version
          } finally {
            $package = Get-AppxPackage -Name "$env:MSIX_IDENTITY_NAME" -ErrorAction SilentlyContinue
            if ($package) {
              Remove-AppxPackage -Package $package.PackageFullName
            }
          }

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload MSIX (Windows)
        if: matrix.msixarch && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dotweave-win32-${{ matrix.msixarch }}-msix
          path: dist/pkg/dotweave-win-${{ matrix.msixarch }}.msix
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - changes
      - lint
      - dart-analyze
      - dart-test
      - homepage
      - autocomplete-shell-smoke
      - build-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        # A job scoped out by diff reports `skipped`, which is a pass.
        # `changes` is the one job that cannot be: it decides the scope, so if
        # it fails every other job skips and the gate would wave through a run
        # that verified nothing.
        run: >-
          jq -e 'all(.[]; .result == "success" or .result == "skipped")
          and (.changes.result == "success")' <<< "$QUALITY_RESULTS"

  bundle-msix:
    name: Bundle MSIX
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - name: Install dependencies
        run: dart pub get
      - name: Download Windows x64 MSIX
        uses: actions/download-artifact@v8
        with:
          name: dotweave-win32-x64-msix
          path: dist/pkg
      - name: Download Windows arm64 MSIX
        uses: actions/download-artifact@v8
        with:
          name: dotweave-win32-arm64-msix
          path: dist/pkg
      - name: Bundle Windows MSIX packages
        shell: powershell
        run: dart run shipworld:shipworld package windows
          bundle dotweave --config shipworld.yaml
          --package-dir dist/pkg
          --output dist/pkg/dotweave-windows.msixbundle
          --working-directory dist/msix/bundle
      - name: Upload Windows MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: dotweave-windows-msixbundle
          path: dist/pkg/dotweave-windows.msixbundle
          if-no-files-found: error

  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    needs:
      - lint
      - dart-analyze
      - dart-test
      - build-and-package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dotweave-linux-x64
            arch: x86_64
            appimagetool_sha256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
          - os: ubuntu-24.04-arm
            artifact: dotweave-linux-arm64
            arch: aarch64
            appimagetool_sha256: 1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - name: Install dependencies
        run: dart pub get
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: release-bin
      - name: Restore executable permissions
        shell: bash
        run: chmod +x release-bin/dotweave-*
      - name: Install verified appimagetool
        shell: bash
        run: |
          curl --fail --location --output appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          echo "${{ matrix.appimagetool_sha256 }}  appimagetool" | sha256sum --check -
          chmod +x appimagetool
      - name: Build AppImage
        env:
          APPIMAGETOOL_PATH: ${{ github.workspace }}/appimagetool
        run: dart run shipworld:shipworld package linux
          appimage dotweave --config shipworld.yaml
          --input release-bin/${{ matrix.artifact }}
          --output ${{ matrix.artifact }}.AppImage
          --arch ${{ matrix.arch }}
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-appimage
          path: ${{ matrix.artifact }}.AppImage

  publish-release:
    name: Publish Release
    needs:
      - lint
      - dart-analyze
      - dart-test
      - homepage
      - autocomplete-shell-smoke
      - build-and-package
      - bundle-msix
      - build-appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - name: Install dependencies
        run: dart pub get

      - name: Verify tag matches package version
        run: dart run shipworld:shipworld release verify
          dotweave --config shipworld.yaml

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dotweave-*
          path: release-assets
          merge-multiple: true

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r artifact_path; do
            gh release upload "${GITHUB_REF_NAME}" "${artifact_path}" --clobber
          done < <(find release-assets -type f | sort)

      - name: Generate Homebrew Formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          dart run shipworld:shipworld package homebrew formula \
            dotweave --config shipworld.yaml \
            --artifacts-dir "${{ github.workspace }}/release-assets" \
            --output "release-assets/dotweave.rb" \
            --versioned-output "release-assets/dotweave@${version}.rb"

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v7
        with:
          repository: tinyrack-net/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew Tap
        run: |
          mkdir -p homebrew-tap/Formula
          cp release-assets/dotweave*.rb homebrew-tap/Formula/
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dotweave*.rb
          git commit -m "Update dotweave to ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push

  publish-winget:
    name: Publish WinGet
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Submit WinGet manifest update
        shell: powershell
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "WINGET_TOKEN repository secret is required for WinGet publishing."
          }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME"
          $releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:GITHUB_REF_NAME"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update tinyrack.dotweave `
            --version $version `
            --urls "$downloadUrl/dotweave-win-x64.exe|x64" "$downloadUrl/dotweave-win-arm64.exe|arm64" `
            --release-notes-url "$releaseNotesUrl" `
            --submit `
            --no-open

  publish-store:
    name: Publish to Microsoft Store
    needs: publish-release
    if: false # Temporarily disabled
    # if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download MSIX bundle
        uses: actions/download-artifact@v8
        with:
          name: dotweave-windows-msixbundle
          path: store-assets

      - name: Set up Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Microsoft Store CLI
        shell: powershell
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId "$env:PARTNER_CENTER_TENANT_ID" `
            --sellerId "$env:PARTNER_CENTER_SELLER_ID" `
            --clientId "$env:PARTNER_CENTER_CLIENT_ID" `
            --clientSecret "$env:PARTNER_CENTER_CLIENT_SECRET"

      - name: Publish MSIX bundle to Store
        shell: powershell
        env:
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          $bundle = Resolve-Path "store-assets/dotweave-windows.msixbundle"
          msstore publish "$bundle" -id "$env:MSSTORE_PRODUCT_ID"
          msstore submission poll "$env:MSSTORE_PRODUCT_ID"

  publish-snap:
    name: Publish Snap (${{ matrix.artifact }})
    needs:
      - lint
      - dart-analyze
      - dart-test
      - build-and-package
    if: false # Temporarily disabled
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dotweave-linux-x64
          - os: ubuntu-24.04-arm
            artifact: dotweave-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: bin-temp

      - name: Prepare binary
        run: |
          mv bin-temp/${{ matrix.artifact }} ./dotweave
          chmod +x ./dotweave

      - name: Build Snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-snap
          path: ${{ steps.build.outputs.snap }}

      - name: Publish Snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.build.outputs.snap }}
          release: stable
