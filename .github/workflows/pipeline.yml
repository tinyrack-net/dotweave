name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' &&
    !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm run format:check
        working-directory: homepage

  dart-analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Validate Dart static checks
        run: dart run packages/cli/tool/validate.dart dart-static

  dart-test:
    name: Dart Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Validate Dart tests
        run: dart run packages/cli/tool/validate.dart dart-tests

  shipworld-quality:
    name: Shipworld Package Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart pub global activate pana 0.23.14
      - run: dart run packages/shipworld/tool/validate_standalone.dart
      - run: dart doc
        working-directory: packages/shipworld
      - run: dart pub publish --dry-run
        working-directory: packages/shipworld

  shipworld-flutter-payload:
    name: Shipworld Flutter Payload (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            payload: build/linux/x64/release/bundle
            launcher: shipworld_fixture
          - os: macos-26
            platform: macos
            payload: build/macos/Build/Products/Release/shipworld_fixture.app
            launcher: Contents/MacOS/shipworld_fixture
          - os: windows-2025
            platform: windows
            payload: build/windows/x64/runner/Release
            launcher: shipworld_fixture.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runner
        run: flutter create --platforms=${{ matrix.platform }}
          --project-name=shipworld_fixture .
        working-directory: packages/shipworld/test/fixtures/flutter_app
      - name: Build Flutter desktop fixture
        run: flutter build ${{ matrix.platform }} --release
        working-directory: packages/shipworld/test/fixtures/flutter_app
      - name: Resolve Dart workspace dependencies
        run: dart pub get
      - name: Verify built directory payload
        run: dart run packages/shipworld/tool/verify_payload.dart
          "${{ github.workspace }}/packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}"
          "${{ matrix.launcher }}"
      - name: Build Windows x64 and arm64 MSIX packages
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SHIPWORLD_MSIX_NAME: shipworld.fixture
          SHIPWORLD_MSIX_PUBLISHER: CN=Shipworld
          SHIPWORLD_MSIX_PUBLISHER_NAME: Shipworld
        run: |
          $config = "packages/shipworld/test/fixtures/flutter_app/shipworld.yaml"
          $input = "packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}"
          dart run packages/shipworld/bin/shipworld.dart package windows msix fixture `
            --config $config --input $input --launcher shipworld_fixture.exe `
            --arch x64 --output dist/shipworld-fixture-x64.msix `
            --package-root .shipworld/msix/x64
          dart run packages/shipworld/bin/shipworld.dart package windows msix fixture `
            --config $config --input $input --launcher shipworld_fixture.exe `
            --arch arm64 --output dist/shipworld-fixture-arm64.msix `
            --package-root .shipworld/msix/arm64
          dart run packages/shipworld/bin/shipworld.dart package windows bundle fixture `
            --config $config --package-dir dist `
            --output dist/shipworld-fixture.msixbundle `
            --working-directory .shipworld/msix/bundle
          tar -tf packages/shipworld/test/fixtures/flutter_app/dist/shipworld-fixture-x64.msix |
            Select-String AppxManifest.xml
      - name: Sign and archive the macOS application
        if: matrix.platform == 'macos'
        run: |
          config=packages/shipworld/test/fixtures/flutter_app/shipworld.yaml
          input=packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}
          output=packages/shipworld/test/fixtures/flutter_app/dist/ShipworldFixture.zip
          mkdir -p "$(dirname "$output")"
          dart run packages/shipworld/bin/shipworld.dart package macos sign fixture \
            --config "$config" --input "$input" --app-bundle --skip-notarize
          dart run packages/shipworld/bin/shipworld.dart package macos archive fixture \
            --config "$config" --input "$input" --output "$output"
          codesign --verify --deep --strict "$input"
          unzip -l "$output" | grep shipworld_fixture.app
      - name: Install verified appimagetool for the Flutter fixture
        if: matrix.platform == 'linux'
        run: |
          curl --fail --location --output appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool" |
            sha256sum --check -
          chmod +x appimagetool
      - name: Build and inspect the Flutter AppImage
        if: matrix.platform == 'linux'
        run: |
          config=packages/shipworld/test/fixtures/flutter_app/shipworld.yaml
          input=packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}
          dart run packages/shipworld/bin/shipworld.dart package linux appimage fixture \
            --config "$config" --input "$input" --launcher shipworld_fixture \
            --output dist/ShipworldFixture.AppImage --arch x86_64 \
            --tool "${{ github.workspace }}/appimagetool"
          artifact=packages/shipworld/test/fixtures/flutter_app/dist/ShipworldFixture.AppImage
          test -x "$artifact"
          "$artifact" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/shipworld_fixture
      - name: Validate Formula and Cask rendering
        if: matrix.platform == 'linux'
        run: |
          fixture=packages/shipworld/test/fixtures/flutter_app
          mkdir -p "$fixture/formula-artifacts"
          for name in shipworld-fixture-macos-arm64 shipworld-fixture-macos-x64 \
            shipworld-fixture-linux-arm64 shipworld-fixture-linux-x64; do
            printf '%s\n' "$name" > "$fixture/formula-artifacts/$name"
          done
          printf 'archive\n' > "$fixture/ShipworldFixture.zip"
          dart run packages/shipworld/bin/shipworld.dart package homebrew formula fixture \
            --config "$fixture/shipworld.yaml" \
            --artifacts-dir "$fixture/formula-artifacts" \
            --output "$fixture/shipworld-fixture.rb"
          dart run packages/shipworld/bin/shipworld.dart package homebrew cask fixture \
            --config "$fixture/shipworld.yaml" \
            --archive "$fixture/ShipworldFixture.zip" \
            --url https://example.invalid/ShipworldFixture.zip \
            --output "$fixture/shipworld-fixture-cask.rb"
          ruby -c "$fixture/shipworld-fixture.rb"
          ruby -c "$fixture/shipworld-fixture-cask.rb"

  homepage:
    name: Homepage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Validate homepage
        run: pnpm run validate
        working-directory: homepage
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: homepage
      - name: Audit homepage in Chromium
        run: pnpm run test:audit
        working-directory: homepage
      - name: Verify Cloudflare deployment bundle
        run: pnpm run deploy:dry-run
        working-directory: homepage

  autocomplete-shell-smoke:
    name: Autocomplete (${{ matrix.os }} / ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: ubuntu-latest
            shell: zsh
          - os: ubuntu-latest
            shell: fish
          - os: macos-26
            shell: bash
          - os: macos-26
            shell: zsh
          - os: macos-26
            shell: fish
          - os: windows-2025
            shell: powershell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install zsh (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.shell == 'zsh'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install fish (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.shell == 'fish'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Install fish (macOS)
        if: startsWith(matrix.os, 'macos') && matrix.shell == 'fish'
        shell: bash
        run: brew install fish
      - name: Install dependencies
        run: dart pub get
      - name: Build e2e binary
        run: dart tool/build_e2e.dart
        working-directory: packages/cli
      - name: Run autocomplete shell smoke tests
        env:
          DOTWEAVE_AUTOCOMPLETE_SHELL: ${{ matrix.shell }}
        run: dart test test/e2e/autocomplete_e2e_test.dart
          test/e2e/autocomplete_pty_e2e_test.dart
        working-directory: packages/cli

  build-and-package:
    name: Build & Package (${{ matrix.target }})
    needs:
      - dart-analyze
      - dart-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            asset: dotweave-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset: dotweave-linux-arm64
          # macos-13 (the previous Intel label) was retired by GitHub;
          # macos-15-intel is the supported Intel macOS runner.
          - os: macos-15-intel
            target: macos-x64
            asset: dotweave-macos-x64
          - os: macos-26
            target: macos-arm64
            asset: dotweave-macos-arm64
          - os: windows-2025
            target: win-x64
            asset: dotweave-win-x64.exe
            msixarch: x64
          - os: windows-11-arm
            target: win-arm64
            asset: dotweave-win-arm64.exe
            msixarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: dart pub get

      - name: Compile executable
        run: dart compile exe bin/dotweave.dart -o ${{ matrix.asset }}
        working-directory: packages/cli

      - name: Sign binary (macOS)
        if: startsWith(matrix.target, 'macos') && (github.ref ==
          'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          dart run packages/shipworld/bin/shipworld.dart package macos sign dotweave \
            --config shipworld.yaml \
            --input packages/cli/${{ matrix.asset }} \
            ${{ !startsWith(github.ref, 'refs/tags/v') && '--skip-notarize' || '' }}

      - name: Smoke test binary
        run: dart run packages/cli/tool/smoke.dart --executable-path
          packages/cli/${{ matrix.asset }}

      - name: Build MSIX package (Windows)
        if: matrix.msixarch && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: dart run packages/shipworld/bin/shipworld.dart package windows msix
          dotweave --config shipworld.yaml --arch ${{ matrix.msixarch }}
          --input packages/cli/${{ matrix.asset }}
          --output packages/cli/dist/pkg/dotweave-win-${{ matrix.msixarch }}.msix
          --package-root packages/cli/dist/msix/${{ matrix.msixarch }}

      - name: Smoke test MSIX alias (Windows x64)
        if: matrix.msixarch == 'x64' && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
        run: |
          $existing = Get-AppxPackage -Name "$env:MSIX_IDENTITY_NAME" -ErrorAction SilentlyContinue
          if ($existing) {
            Remove-AppxPackage -Package $existing.PackageFullName
          }
          Add-AppxPackage -Register (Resolve-Path "packages/cli/dist/msix/x64/AppxManifest.xml")
          try {
            dotweave.exe --version
          } finally {
            $package = Get-AppxPackage -Name "$env:MSIX_IDENTITY_NAME" -ErrorAction SilentlyContinue
            if ($package) {
              Remove-AppxPackage -Package $package.PackageFullName
            }
          }

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: packages/cli/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload MSIX (Windows)
        if: matrix.msixarch && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dotweave-win32-${{ matrix.msixarch }}-msix
          path: packages/cli/dist/pkg/dotweave-win-${{ matrix.msixarch }}.msix
          if-no-files-found: error

  bundle-msix:
    name: Bundle MSIX
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: dart pub get
      - name: Download Windows x64 MSIX
        uses: actions/download-artifact@v8
        with:
          name: dotweave-win32-x64-msix
          path: packages/cli/dist/pkg
      - name: Download Windows arm64 MSIX
        uses: actions/download-artifact@v8
        with:
          name: dotweave-win32-arm64-msix
          path: packages/cli/dist/pkg
      - name: Bundle Windows MSIX packages
        shell: powershell
        run: dart run packages/shipworld/bin/shipworld.dart package windows
          bundle dotweave --config shipworld.yaml
          --package-dir packages/cli/dist/pkg
          --output packages/cli/dist/pkg/dotweave-windows.msixbundle
          --working-directory packages/cli/dist/msix/bundle
      - name: Upload Windows MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: dotweave-windows-msixbundle
          path: packages/cli/dist/pkg/dotweave-windows.msixbundle
          if-no-files-found: error

  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    needs:
      - lint
      - dart-analyze
      - dart-test
      - build-and-package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dotweave-linux-x64
            arch: x86_64
            appimagetool_sha256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
          - os: ubuntu-24.04-arm
            artifact: dotweave-linux-arm64
            arch: aarch64
            appimagetool_sha256: 1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: dart pub get
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: release-bin
      - name: Restore executable permissions
        shell: bash
        run: chmod +x release-bin/dotweave-*
      - name: Install verified appimagetool
        shell: bash
        run: |
          curl --fail --location --output appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          echo "${{ matrix.appimagetool_sha256 }}  appimagetool" | sha256sum --check -
          chmod +x appimagetool
      - name: Build AppImage
        env:
          APPIMAGETOOL_PATH: ${{ github.workspace }}/appimagetool
        run: dart run packages/shipworld/bin/shipworld.dart package linux
          appimage dotweave --config shipworld.yaml
          --input release-bin/${{ matrix.artifact }}
          --output ${{ matrix.artifact }}.AppImage
          --arch ${{ matrix.arch }}
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-appimage
          path: ${{ matrix.artifact }}.AppImage

  publish-release:
    name: Publish Release
    needs:
      - lint
      - dart-analyze
      - dart-test
      - homepage
      - autocomplete-shell-smoke
      - build-and-package
      - bundle-msix
      - build-appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: dart pub get

      - name: Verify tag matches package version
        run: dart run packages/shipworld/bin/shipworld.dart release verify
          dotweave --config shipworld.yaml

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dotweave-*
          path: release-assets
          merge-multiple: true

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r artifact_path; do
            gh release upload "${GITHUB_REF_NAME}" "${artifact_path}" --clobber
          done < <(find release-assets -type f | sort)

      - name: Generate Homebrew Formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          dart run packages/shipworld/bin/shipworld.dart package homebrew formula \
            dotweave --config shipworld.yaml \
            --artifacts-dir "${{ github.workspace }}/release-assets" \
            --output "release-assets/dotweave.rb" \
            --versioned-output "release-assets/dotweave@${version}.rb"

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew Tap
        run: |
          mkdir -p homebrew-tap/Formula
          cp release-assets/dotweave*.rb homebrew-tap/Formula/
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dotweave*.rb
          git commit -m "Update dotweave to ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push

  publish-winget:
    name: Publish WinGet
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Submit WinGet manifest update
        shell: powershell
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "WINGET_TOKEN repository secret is required for WinGet publishing."
          }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME"
          $releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:GITHUB_REF_NAME"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update tinyrack.dotweave `
            --version $version `
            --urls "$downloadUrl/dotweave-win-x64.exe|x64" "$downloadUrl/dotweave-win-arm64.exe|arm64" `
            --release-notes-url "$releaseNotesUrl" `
            --submit `
            --no-open

  publish-store:
    name: Publish to Microsoft Store
    needs: publish-release
    if: false # Temporarily disabled
    # if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download MSIX bundle
        uses: actions/download-artifact@v8
        with:
          name: dotweave-windows-msixbundle
          path: store-assets

      - name: Set up Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store CLI
        shell: powershell
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId "$env:PARTNER_CENTER_TENANT_ID" `
            --sellerId "$env:PARTNER_CENTER_SELLER_ID" `
            --clientId "$env:PARTNER_CENTER_CLIENT_ID" `
            --clientSecret "$env:PARTNER_CENTER_CLIENT_SECRET"

      - name: Publish MSIX bundle to Store
        shell: powershell
        env:
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          $bundle = Resolve-Path "store-assets/dotweave-windows.msixbundle"
          msstore publish "$bundle" -id "$env:MSSTORE_PRODUCT_ID"
          msstore submission poll "$env:MSSTORE_PRODUCT_ID"

  publish-snap:
    name: Publish Snap (${{ matrix.artifact }})
    needs:
      - lint
      - dart-analyze
      - dart-test
      - build-and-package
    if: false # Temporarily disabled
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dotweave-linux-x64
          - os: ubuntu-24.04-arm
            artifact: dotweave-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: bin-temp

      - name: Prepare binary
        run: |
          mv bin-temp/${{ matrix.artifact }} ./dotweave
          chmod +x ./dotweave

      - name: Build Snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-snap
          path: ${{ steps.build.outputs.snap }}

      - name: Publish Snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.build.outputs.snap }}
          release: stable
