name: 'Setup Node project'
description: 'Node/pnpm setup and install for a standalone Node project directory'
inputs:
  node-version:
    description: 'Node version to use'
    default: '24'
  install:
    description: 'Whether to run pnpm install'
    default: 'true'
  working-directory:
    description: 'Directory containing the pnpm project to install'
    default: 'homepage'

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable Corepack
      run: corepack enable
      shell: bash

    - name: Prepare pnpm
      run: corepack prepare pnpm@11.9.0 --activate
      shell: bash

    - name: Install dependencies (Windows)
      if: inputs.install == 'true' && runner.os == 'Windows'
      run: pnpm install --frozen-lockfile
      shell: powershell
      working-directory: ${{ inputs.working-directory }}

    - name: Install dependencies (Non-Windows)
      if: inputs.install == 'true' && runner.os != 'Windows'
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
