name: shipworld
description: >-
  Reusable release, signing, and desktop packaging tooling for Dart CLI,
  Flutter desktop, and independently versioned pub package workspaces.
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/tinyrack-net/shipworld
issue_tracker: https://github.com/tinyrack-net/shipworld/issues
topics:
  - release
  - packaging
  - cli
  - desktop

environment:
  sdk: ^3.12.0

executables:
  shipworld: shipworld

dependencies:
  archive: ^4.0.0
  cliweave: ^0.1.1
  crypto: ^3.0.0
  path: ^1.9.0
  pub_semver: ^2.2.0
  yaml: ^3.1.0
  yaml_edit: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
