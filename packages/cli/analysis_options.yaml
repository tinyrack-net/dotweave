include: ../../analysis_options.yaml

# Package-local ratchet. Rules land here first so the CLI can tighten
# independently of packages/tools; promote to the workspace root once both
# packages are clean.
#
# Deliberately NOT enabled yet, with the phase that unblocks each:
# - avoid_positional_boolean_parameters (17 violations): the offenders are
#   `repo_artifacts`/`pull_apply` signatures that the repo_artifacts split
#   rewrites anyway. Enabling first would churn signatures twice.
# - cast_nullable_to_non_nullable (12 violations): almost all are
#   `flags['x'] as String` at command boundaries, forced by the untyped
#   `Map<String, Object?>` flag map. Adding `!` would satisfy the lint without
#   fixing anything; typed flags remove the casts at the source.
# - only_throw_errors (4 violations, all in lib/git.dart): enable once git
#   stops throwing bare `Exception`.
linter:
  rules:
    - prefer_final_locals
    - require_trailing_commas
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - use_super_parameters
