name: dotweave_age
description: >-
  Pure Dart implementation of the age v1 file encryption format (X25519
  recipients), used by the dotweave CLI to store secret artifacts.
version: 1.0.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.12.0

dependencies:
  cryptography: ^2.7.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.26.0
