name: tinyrack_cli
description: >-
  A typed CLI framework: command routing, argument scanning with kebab/camel
  aliasing, did-you-mean suggestions, rendered help, structured exit codes,
  shell-completion proposals, and a terminal logger, spinner, and colour theme.
version: 0.1.0
# Not published yet. Everything else about this package is publish-ready, so
# releasing is a matter of deleting this line and running `dart pub publish`.
publish_to: none
resolution: workspace
repository: https://github.com/tinyrack/dotweave
issue_tracker: https://github.com/tinyrack/dotweave/issues
topics:
  - cli
  - command-line
  - argument-parser
  - shell-completion

environment:
  sdk: ^3.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
