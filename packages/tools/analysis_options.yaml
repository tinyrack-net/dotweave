include: ../../analysis_options.yaml

# Same ratchet as packages/cli. This was the last package without one, which is
# what kept these rules from moving to the workspace root.
linter:
  rules:
    - only_throw_errors
    - prefer_final_locals
    - require_trailing_commas
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - use_super_parameters
