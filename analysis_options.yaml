include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - unawaited_futures
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_single_quotes
    - directives_ordering
    - only_throw_errors
    - prefer_final_locals
    - require_trailing_commas
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - use_super_parameters
