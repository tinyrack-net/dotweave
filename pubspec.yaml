name: dotweave
description: >-
  Cross-platform dotfiles sync CLI. Dart port of @tinyrack/dotweave.
version: 2.4.0
publish_to: none
environment:
  sdk: ^3.12.0

executables:
  dotweave: dotweave

dependencies:
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: b0a3e334eb09d7d6ed91549e26f06d99fb61101f
      path: packages/cliweave
  cryptography: ^2.7.0
  dartage:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 7e924a446fe5fdc80c1eb3fb2d437bf524cb529d
      path: packages/dartage
  ffi: ^2.1.0
  path: ^1.9.0
  win32: ^6.3.0

dev_dependencies:
  lints: ^6.0.0
  shipworld:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: c82cd8351d216cfa21de517375c0241dae7d57bd
      path: packages/shipworld
  test: ^1.26.0

# shipworld declares `cliweave: ^0.2.0` from pub.dev; this override keeps a
# single git-sourced cliweave and is what makes resolution succeed.
dependency_overrides:
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: b0a3e334eb09d7d6ed91549e26f06d99fb61101f
      path: packages/cliweave
