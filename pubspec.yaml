name: dotweave
description: >-
  Cross-platform dotfiles sync CLI. Dart port of @tinyrack/dotweave.
version: 2.6.0
publish_to: none
environment:
  sdk: ^3.13.0

executables:
  dotweave: dotweave

dependencies:
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 5da5311a53bc2cf401f4bc8efb97518adeeced32
      path: packages/cliweave
  cryptography: ^2.9.0
  dartage:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 5da5311a53bc2cf401f4bc8efb97518adeeced32
      path: packages/dartage
  ffi: ^2.2.0
  path: ^1.9.1
  win32: ^6.4.0

dev_dependencies:
  lints: ^6.1.0
  shipworld:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 5da5311a53bc2cf401f4bc8efb97518adeeced32
      path: packages/shipworld
  test: ^1.32.0

# shipworld declares a pub.dev cliweave range; this override keeps a single
# git-sourced cliweave and is what makes resolution succeed.
dependency_overrides:
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 5da5311a53bc2cf401f4bc8efb97518adeeced32
      path: packages/cliweave
