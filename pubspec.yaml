name: dotweave
description: >-
  Cross-platform dotfiles sync CLI. Dart port of @tinyrack/dotweave.
version: 2.5.1
publish_to: none
environment:
  sdk: ^3.12.0

executables:
  dotweave: dotweave

dependencies:
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 7e1b0065513936e801109f87af21b4afd9ea05ab
      path: packages/cliweave
  cryptography: ^2.7.0
  dartage:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 7e1b0065513936e801109f87af21b4afd9ea05ab
      path: packages/dartage
  ffi: ^2.1.0
  path: ^1.9.0
  win32: ^6.4.0

dev_dependencies:
  lints: ^6.0.0
  shipworld:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 7e1b0065513936e801109f87af21b4afd9ea05ab
      path: packages/shipworld
  test: ^1.26.0

# shipworld declares `cliweave: ^0.2.0` from pub.dev; this override keeps a
# single git-sourced cliweave and is what makes resolution succeed.
dependency_overrides:
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 7e1b0065513936e801109f87af21b4afd9ea05ab
      path: packages/cliweave
