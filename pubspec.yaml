name: dotweave_workspace
publish_to: none
environment:
  sdk: ^3.12.0
workspace:
  - packages/cli

# shipworld lives in the tinyrack-net/dart-packages monorepo and is published to
# pub.dev. It is a dependency of the workspace root so `dart run shipworld:shipworld`
# resolves here (where CI invokes it against shipworld.yaml).
dependencies:
  shipworld: ^0.1.2
